<!DOCTYPE html>
<html>
  <head>
    <title>Fancify my Text</title>
    <script src="fancifymytext.js"></script>
  </head>
  <body>
    <h1>Fancify my Text</h1>

    <fieldset>
      <legend>Text</legend>
      <textarea id="text" rows="4" cols="30"></textarea>
    </fieldset>

    <fieldset>
      <legend>Fancify</legend>
      <button onclick="bigger()">Bigger!</button>
      <label>
        <input type="radio" id="fancy" name="style" onchange="fancify()" />
        FancyShmancy
      </label>
      <label>
        <input type="radio" id="boring" name="style" onchange="fancify()" />
        BoringBetty
      </label>
      <button onclick="moo()">Moo</button>
    </fieldset>
  </body>
</html>
